<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font-family: system-ui, sans-serif; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; max-width: 100vw; max-height: 80vh; border: 2px solid #333; }
  p { color: #999; margin: 12px 16px; text-align: center; }
  a { color: #8cf; }
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<p>W / S or ↑ / ↓ to move · drag on touch screens · Space to pause · first to 7 wins<br>
<a href="../">← all games</a></p>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height, PW = 12, PH = 80, R = 8, WIN = 7;
const keys = {};
let player, ai, ball, paused = false, winner = null;

function reset() {
  player = { y: H / 2 - PH / 2, score: 0 };
  ai = { y: H / 2 - PH / 2, score: 0 };
  winner = null;
  serve(Math.random() < 0.5 ? 1 : -1);
}
function serve(dir) {
  const a = (Math.random() - 0.5) * Math.PI / 3;
  ball = { x: W / 2, y: H / 2, vx: dir * 5 * Math.cos(a), vy: 5 * Math.sin(a) };
}

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); if (winner) reset(); else paused = !paused; }
  if (['ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);
function touch(e) {
  const r = c.getBoundingClientRect();
  player.y = (e.touches[0].clientY - r.top) * (H / r.height) - PH / 2;
  e.preventDefault();
}
c.addEventListener('touchstart', e => { if (winner) reset(); touch(e); }, { passive: false });
c.addEventListener('touchmove', touch, { passive: false });

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function hitPaddle(px, py) {
  if (ball.y + R < py || ball.y - R > py + PH) return false;
  const off = (ball.y - (py + PH / 2)) / (PH / 2);          // -1 .. 1
  const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
  const angle = off * Math.PI / 3.5;
  ball.vx = Math.sign(-ball.vx) * speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle);
  return true;
}

function update() {
  if (paused || winner) return;
  if (keys.w || keys.W || keys.ArrowUp) player.y -= 7;
  if (keys.s || keys.S || keys.ArrowDown) player.y += 7;
  player.y = clamp(player.y, 0, H - PH);

  // AI follows the ball with a speed cap so it can be beaten
  const target = ball.y - PH / 2;
  ai.y += clamp(target - ai.y, -4.5, 4.5);
  ai.y = clamp(ai.y, 0, H - PH);

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.y < R || ball.y > H - R) { ball.vy *= -1; ball.y = clamp(ball.y, R, H - R); }

  if (ball.vx < 0 && ball.x - R <= 20 + PW && ball.x > 20) {
    if (hitPaddle(20, player.y)) ball.x = 20 + PW + R;
  }
  if (ball.vx > 0 && ball.x + R >= W - 20 - PW && ball.x < W - 20) {
    if (hitPaddle(W - 20 - PW, ai.y)) ball.x = W - 20 - PW - R;
  }

  if (ball.x < -R) { ai.score++; serve(-1); }
  if (ball.x > W + R) { player.score++; serve(1); }
  if (player.score >= WIN) winner = 'You win!';
  if (ai.score >= WIN) winner = 'Computer wins';
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#444';
  for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 15);
  ctx.fillStyle = '#fff';
  ctx.fillRect(20, player.y, PW, PH);
  ctx.fillRect(W - 20 - PW, ai.y, PW, PH);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();
  ctx.font = '48px monospace'; ctx.textAlign = 'center';
  ctx.fillText(player.score, W / 4, 60);
  ctx.fillText(ai.score, W * 3 / 4, 60);
  if (paused || winner) {
    ctx.font = '36px system-ui, sans-serif';
    ctx.fillText(winner || 'Paused', W / 2, H / 2 - 10);
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(winner ? 'Press Space or tap to play again' : 'Press Space to resume', W / 2, H / 2 + 30);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
